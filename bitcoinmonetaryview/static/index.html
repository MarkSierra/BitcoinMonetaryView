<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Monetary View</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/overview" aria-label="Monetary View home">
      <img src="favicon.svg" alt="" width="28" height="28">
      <span class="brand-name">Monetary <b>View</b></span>
    </a>
    <nav class="tabs" aria-label="Views">
      <a href="#/overview" data-view="overview">Overview</a>
      <a href="#/blocks" data-view="blocks">Blocks</a>
      <a href="#/history" data-view="history">History</a>
      <a href="#/utxo" data-view="utxo">UTXO set</a>
      <a href="#/about" data-view="about">About</a>
      <a href="#/connection" data-view="connection">Connection</a>
    </nav>
    <div class="topbar-right">
      <span class="ro-badge" title="This app only reads from your node. It never changes anything on it.">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 1l6 2.5v4.2c0 3.6-2.5 6.3-6 7.3-3.5-1-6-3.7-6-7.3V3.5z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.2 8.2l2 2 3.8-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="ro-text">Read-only</span>
      </span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="statusbar" id="statusbar" aria-live="polite" aria-label="Scan status">
  <div class="statusbar-inner">
    <div class="status-left">
      <span class="phase-pill" id="phase-pill"><span class="dot"></span><span id="phase-label">Starting</span></span>
      <div class="status-text">
        <div class="status-detail" id="status-detail">Connecting to your node…</div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>
    <dl class="status-metrics" id="status-metrics">
      <div><dt>Block</dt><dd id="m-height">–</dd></div>
      <div><dt>Progress</dt><dd id="m-progress">–</dd></div>
      <div><dt>Speed</dt><dd id="m-speed">–</dd></div>
      <div><dt>Elapsed</dt><dd id="m-elapsed">–</dd></div>
      <div><dt>ETA</dt><dd id="m-eta">–</dd></div>
    </dl>
    <button class="btn btn-ghost" id="pause-btn" type="button" hidden>Pause</button>
  </div>
</section>

<div class="banners" id="banners"></div>

<main id="main" tabindex="-1">
  <div class="loading" id="loading">Loading…</div>
</main>

<footer class="footer">
  <span>BitcoinMonetaryView <span id="app-version"></span> · Spam rules from
    <a href="https://github.com/sambitcoin/BitcoinMonetaryNode" rel="noopener noreferrer" target="_blank">Monetary Node</a>
    · Free software (AGPL-3.0) · No telemetry, no external requests</span>
</footer>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<dialog id="dialog"><div id="dialog-body"></div></dialog>
</body>
</html>
