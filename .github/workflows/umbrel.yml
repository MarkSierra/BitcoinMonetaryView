# The Umbrel packages installed and used through a real umbrelOS (the official image, run as a container),
# with Umbrel's Bitcoin Node app switched to regtest and fed spam blocks: the community-store package as
# published, and the official App Store package (copied into umbrelOS's official store, as Umbrel's own
# testing guide does).
name: umbrelOS

on:
  workflow_dispatch:
    inputs:
      umbrelos:
        description: umbrelOS image tag
        default: "2.0.1"
      node:
        description: Umbrel app that provides the bitcoin dependency
        default: bitcoin
      official_repo:
        description: Git repository holding the official-store package
        default: https://github.com/MarkSierra/umbrel-apps
      official_ref:
        description: Branch of that repository
        default: bitcoinmonetaryview
  pull_request:
    paths:
      - .github/workflows/umbrel.yml
      - tests/umbrel_*.py

permissions:
  contents: read

env:
  OFFICIAL_APP: bitcoinmonetaryview
  OFFICIAL_REPO: ${{ inputs.official_repo || 'https://github.com/MarkSierra/umbrel-apps' }}
  OFFICIAL_REF: ${{ inputs.official_ref || 'bitcoinmonetaryview' }}

jobs:
  lint:
    # Umbrel's own App Store lint (including the image checks) on the official-store package
    runs-on: ubuntu-latest
    steps:
      - name: Umbrel's lint on ${{ env.OFFICIAL_APP }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 https://github.com/getumbrel/umbrel-apps.git store
          git clone -q --depth 1 --branch "$OFFICIAL_REF" "$OFFICIAL_REPO" pkg
          rm -rf "store/$OFFICIAL_APP"
          cp -r "pkg/$OFFICIAL_APP" "store/$OFFICIAL_APP"
          cd store
          npm ci --no-audit --no-fund
          npm run lint:apps -- "$OFFICIAL_APP" --check-images

  umbrelos:
    name: umbrelOS ${{ inputs.umbrelos || '2.0.1' }} (${{ matrix.arch }}, ${{ matrix.package }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        package: [community, official]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      UMBRELOS: ${{ inputs.umbrelos || '2.0.1' }}
      STORE: https://github.com/MarkSierra/umbrel-community-app-store
      APP: ${{ matrix.package == 'official' && 'bitcoinmonetaryview' || 'marksierra-bitcoinmonetaryview' }}
      NODE_APP: ${{ inputs.node || 'bitcoin' }}
      # a throwaway login for the disposable test system
      UMBREL_PASSWORD: ci-umbrel-test
      OUT: umbrel-evidence
      LABEL: ${{ matrix.arch }}-${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Install Playwright and Chromium (test tooling only)
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium

      - name: Boot umbrelOS ${{ env.UMBRELOS }}
        run: |
          set -euo pipefail
          docker run -d -t --name umbrelos --privileged --network host \
            -v umbrelos-test:/data "ghcr.io/getumbrel/umbrelos:${UMBRELOS}" /sbin/init
          for i in $(seq 1 120); do
            docker exec umbrelos umbreld client user.exists.query >/dev/null 2>&1 && break
            sleep 5
          done
          docker exec umbrelos umbreld client user.exists.query
          docker exec umbrelos umbreld client user.register.mutate --name CI --password "$UMBREL_PASSWORD"
          mkdir -p "$OUT"

      - name: Helper functions
        run: |
          cat > "$RUNNER_TEMP/umbrel.sh" <<'EOF'
          uc() { docker exec umbrelos umbreld client "$@"; }
          in_umbrel() { docker exec -i umbrelos "$@"; }
          wait_state() {  # app, wanted state
            for i in $(seq 1 180); do
              s=$(uc apps.state.query --appId "$1" 2>&1 || true)
              echo "$s" | grep -q "'$2'\|\"$2\"" && return 0
              sleep 5
            done
            echo "$1 did not reach $2: $s"; return 1
          }
          app_data() {  # app -> its data directory on the umbrelOS system
            in_umbrel sh -c "ls -d /home/umbrel/umbrel/app-data/$1 2>/dev/null || find / -xdev -type d -path '*/app-data/$1' 2>/dev/null | head -1"
          }
          EOF

      - name: Install ${{ env.NODE_APP }} and switch it to regtest
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/umbrel.sh"
          uc apps.install.mutate --appId "$NODE_APP"
          wait_state "$NODE_APP" ready
          uc apps.stop.mutate --appId "$NODE_APP"
          wait_state "$NODE_APP" stopped
          dir="$(app_data "$NODE_APP")/data/app"
          echo "settings: $dir/settings.json"
          in_umbrel sh -c "mkdir -p '$dir' && printf '%s\n' '{\"chain\": \"regtest\"}' > '$dir/settings.json' && chown -R 1000:1000 '$dir'"
          uc apps.start.mutate --appId "$NODE_APP"
          wait_state "$NODE_APP" ready

      - name: Mine regtest blocks with spam
        id: feed
        run: |
          set -euo pipefail
          user=$(docker exec umbrelos docker exec "${NODE_APP}_app_1" printenv RPC_USER)
          pass=$(docker exec umbrelos docker exec "${NODE_APP}_app_1" printenv RPC_PASS)
          echo "::add-mask::$pass"
          python -m tests.umbrel_feed http://127.0.0.1:8332 "$user" "$pass" | tee -a "$GITHUB_OUTPUT"

      - name: Install ${{ env.APP }} through Umbrel
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/umbrel.sh"
          if [ "${{ matrix.package }}" = official ]; then
            # into umbrelOS's copy of the official store, as Umbrel's testing guide does
            git clone -q --depth 1 --branch "$OFFICIAL_REF" "$OFFICIAL_REPO" pkg
            rm -f "pkg/$APP/data/app/.gitkeep"
            official=$(in_umbrel sh -c 'ls -d /home/umbrel/umbrel/app-stores/getumbrel-umbrel-apps-github-*' | head -1)
            echo "official store: $official"
            tar -C pkg -cf - "$APP" | in_umbrel tar -C "$official" -xf -
            in_umbrel chown -R 1000:1000 "$official/$APP"
          else
            uc appStore.addRepository.mutate --url "$STORE"
          fi
          for i in $(seq 1 60); do
            uc appStore.registry.query | grep -q "$APP" && break
            sleep 5
          done
          uc apps.install.mutate --appId "$APP"
          wait_state "$APP" ready
          uc apps.list.query > "$OUT/$LABEL-apps-list.txt" || true

      - name: Open it through Umbrel and wait for the scan
        run: |
          . "$RUNNER_TEMP/umbrel.sh"
          port=$(in_umbrel grep -E '^port:' "$(app_data "$APP")/umbrel-app.yml" | awk '{print $2}')
          echo "app port: $port"
          echo "APP_PORT=$port" >> "$GITHUB_ENV"
          python -m tests.umbrel_ui http://localhost "$port" "$UMBREL_PASSWORD" \
            "${{ steps.feed.outputs.height }}" "${{ steps.feed.outputs.spam_height }}" "$OUT" "$LABEL-install"

      - name: Restart through Umbrel; the scan must persist
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/umbrel.sh"
          in_umbrel ls -la "$(app_data "$APP")/data/app/regtest"
          uc apps.restart.mutate --appId "$APP"
          wait_state "$APP" ready
          # straight after the restart, before any rescan could finish, the saved scan must be there
          for i in $(seq 1 60); do
            out=$(docker exec umbrelos docker exec "${APP}_web_1" python3 -c \
              "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8338/api/summary').read().decode())" 2>/dev/null) && break
            sleep 2
          done
          echo "$out" | head -c 600; echo
          if echo "$out" | grep -q '"empty": *true'; then echo "scan was lost on restart"; exit 1; fi
          python -m tests.umbrel_ui http://localhost "$APP_PORT" "$UMBREL_PASSWORD" \
            "${{ steps.feed.outputs.height }}" "${{ steps.feed.outputs.spam_height }}" "$OUT" "$LABEL-restart"

      - name: App logs (no tracebacks)
        if: always()
        run: |
          . "$RUNNER_TEMP/umbrel.sh"
          uc apps.logs.query --appId "$APP" > "$OUT/$LABEL-app-logs.txt" 2>&1 || true
          uc apps.logs.query --appId "$NODE_APP" > "$OUT/$LABEL-node-logs.txt" 2>&1 || true
          docker exec umbrelos journalctl -u umbrel --no-pager -n 300 > "$OUT/$LABEL-umbreld.txt" 2>&1 || true
          tail -n 40 "$OUT/$LABEL-app-logs.txt"
          ! grep -n "Traceback" "$OUT/$LABEL-app-logs.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: umbrelos-${{ matrix.arch }}-${{ matrix.package }}
          path: ${{ env.OUT }}
