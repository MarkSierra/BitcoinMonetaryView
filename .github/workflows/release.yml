name: Release image

# Publishes a multi-arch Docker image to GitHub Container Registry.
# - "Run workflow" on main: tags the version from bitcoinmonetaryview/__init__.py (vX.Y.Z), creates the
#   GitHub release (that version's CHANGELOG.md section as "Highlights", then GitHub's generated list of
#   merged pull requests), then publishes the image. If the release exists, its notes are refreshed;
#   with "notes only" nothing else happens.
# - Pushing a version tag (vX.Y.Z) by hand publishes the image for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes_only:
        description: "Only refresh the release notes of the current version (no image)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Tests must pass before publishing
        run: python -m unittest discover -s tests -t .
      - id: version
        name: Version, tag and release notes
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bitcoinmonetaryview/__init__.py)
          grep -qx "version = \"$version\"" pyproject.toml || { echo "::error::pyproject.toml is not at $version"; exit 1; }
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "$tag" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          else
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run this workflow on main"; exit 1; }
            python3 .github/scripts/release_notes.py "$version" > notes.md
            printf '\n' >> notes.md
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" --jq .body >> notes.md
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$tag" --notes-file notes.md
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: release
    if: ${{ !inputs.notes_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # signs the provenance attestation (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Image name in lower case (registry names must be)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      # Signed statement that this exact image (all architectures) was built by this workflow
      # from this commit. Verify: gh attestation verify oci://ghcr.io/marksierra/bitcoinmonetaryview:X.Y.Z
      #   --repo MarkSierra/BitcoinMonetaryView
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
