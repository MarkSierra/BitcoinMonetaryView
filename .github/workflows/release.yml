name: Release image

# Publishes a multi-arch Docker image to GitHub Container Registry.
# - "Run workflow" on main: tags the version from bitcoinmonetaryview/__init__.py (vX.Y.Z), creates the
#   GitHub release with that version's CHANGELOG.md section as notes, then publishes the image.
# - Pushing a version tag (vX.Y.Z) by hand publishes the image for that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests must pass before publishing
        run: python -m unittest discover -s tests -t .
      - id: version
        name: Version, tag and release notes
        run: |
          set -euo pipefail
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bitcoinmonetaryview/__init__.py)
          grep -qx "version = \"$version\"" pyproject.toml || { echo "::error::pyproject.toml is not at $version"; exit 1; }
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$GITHUB_REF_NAME" = "$tag" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          else
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run this workflow on main"; exit 1; }
            # The changelog section "## [X.Y.Z] — date" becomes the release notes.
            awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
            [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag exists already; publishing its image again."
            else
              gh release create "$tag" --target "$GITHUB_SHA" --title "BitcoinMonetaryView $version" --notes-file notes.md
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
