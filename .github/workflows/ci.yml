name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit, parity, security and upstream tests
        run: python -m unittest discover -s tests -t . -v
      - name: Vendored upstream files are unmodified
        run: |
          sha256sum -c <<'EOF'
          508c2cd249539a9f12793e30d330cdceed9ce3f15fe07b9dfb1367387379b333  bitcoinmonetaryview/rules/upstream/monetary_store.py
          9841b343ed381f42c41c1775c3db79441f3a3fc199c2f40c77a96b649d576b73  bitcoinmonetaryview/rules/upstream/carrier_policy.py
          cdb207784291f29dcbca18090b8042749ba37cc1ab9e8ba5b940d14f8f6c07ea  tests/upstream/test_monetary_store.py
          EOF

  regtest:
    # The app against real nodes: the oldest tested Core, the current Core and the current Knots.
    name: regtest (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: Core 29.1
            base: https://bitcoincore.org/bin/bitcoin-core-29.1
            file: bitcoin-29.1-x86_64-linux-gnu.tar.gz
          - node: Core 31.1
            base: https://bitcoincore.org/bin/bitcoin-core-31.1
            file: bitcoin-31.1-x86_64-linux-gnu.tar.gz
          - node: Knots 29.4.1
            base: https://bitcoinknots.org/files/29.x/29.4.1.knots20260508
            file: bitcoin-29.4.1.knots20260508-x86_64-linux-gnu.tar.gz
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download ${{ matrix.node }} (checksum verified)
        env:
          BASE: ${{ matrix.base }}
          FILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          mkdir node && cd node
          curl -fsSLO "${BASE}/${FILE}"
          curl -fsSLO "${BASE}/SHA256SUMS"
          grep -F " ${FILE}" SHA256SUMS | sha256sum -c -
          tar xzf "${FILE}"
          bitcoind=$(find "$PWD" -type f -name bitcoind -path '*/bin/*' | head -1)
          "$bitcoind" -version | head -1
          echo "BMV_BITCOIND=$bitcoind" >> "$GITHUB_ENV"
      - name: Integration test against a real regtest node
        run: python -m unittest tests.test_regtest -v

  browser:
    # Every dashboard page in a real Chromium: no JavaScript or console errors, no failed
    # API calls, no requests outside the app, no sideways scrolling on phones and tablets.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium (test tooling only, not an app dependency)
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Browser test of the dashboard
        run: python -m unittest tests.test_browser -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t bitcoinmonetaryview:ci .
      - name: Image starts and reports healthy API
        run: |
          docker run -d --name bmv --read-only --tmpfs /tmp --cap-drop ALL \
            -e BMV_RPC_URL=http://127.0.0.1:1 -e BMV_RPC_USER=u -e BMV_RPC_PASSWORD=p \
            -p 127.0.0.1:8338:8338 bitcoinmonetaryview:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8338/api/health && exit 0; sleep 1; done
          docker logs bmv; exit 1

  docker-riscv64:
    # The released image includes linux/riscv64; check that it builds and serves under emulation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build image for riscv64
        run: docker buildx build --platform linux/riscv64 --load -t bitcoinmonetaryview:riscv64 .
      - name: Image starts and reports healthy API (emulated)
        run: |
          docker run -d --name bmv --platform linux/riscv64 --read-only --tmpfs /tmp --cap-drop ALL \
            -e BMV_RPC_URL=http://127.0.0.1:1 -e BMV_RPC_USER=u -e BMV_RPC_PASSWORD=p \
            -p 127.0.0.1:8338:8338 bitcoinmonetaryview:riscv64
          docker exec bmv python3 -c "import platform; print(platform.machine())" | grep -qx riscv64
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:8338/api/health && exit 0; sleep 1; done
          docker logs bmv; exit 1
