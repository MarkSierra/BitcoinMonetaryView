[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoinmonetaryview"
version = "0.2.1"
description = "Read-only spam analysis for Bitcoin Core/Knots nodes, based on the Monetary Node rules"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
bitcoinmonetaryview = "bitcoinmonetaryview.__main__:main"

[tool.setuptools.packages.find]
include = ["bitcoinmonetaryview*"]

[tool.setuptools.package-data]
bitcoinmonetaryview = ["static/*", "rules/upstream/LICENSE"]
